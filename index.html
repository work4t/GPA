<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty of Science GPA Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
--primary: #235fa7;
--accent: #3182dc;
--bg-color: #f8f9fa;
--text-color: #333;
--muted-text: #888;
}
* {
font-family: 'Cairo', Tahoma, sans-serif !important;
font-weight: 700 !important;
}
body {
background-color: var(--bg-color);
padding: 15px;
display: flex;
justify-content: center;
align-items: center;
min-height: 90vh;
color: var(--text-color);
transition: background-color 0.3s, color 0.3s;
margin: 0;
}
.container {
background: white;
padding: 35px 25px;
border-radius: 16px;
box-shadow: 0 12px 30px rgba(0,0,0,0.06);
max-width: 500px;
width: 100%;
box-sizing: border-box;
position: relative;
text-align: center;
transition: background-color 0.3s, box-shadow 0.3s;
overflow: hidden;
}
h2 {
text-align: center;
color: #000;
border-bottom: 3px solid var(--accent);
padding-bottom: 12px;
font-weight: 800 !important;
margin-top: 30px;
font-size: 22px;
margin-bottom: 30px;
transition: color 0.3s;
line-height: 1.4;
}
.middle-text {
font-size: 15px;
color: var(--text-color);
margin-bottom: 25px;
}
.notification-wrapper {
height: 20px;
margin-bottom: 5px;
display: flex;
justify-content: center;
align-items: center;
}
.copy-notification {
font-size: 13px;
color: var(--muted-text);
opacity: 0;
transition: opacity 0.3s ease;
}
.copy-notification.show {
opacity: 1;
}
.input-copy-wrapper {
display: flex;
direction: ltr;
background: #f1f3f5;
border: 2px solid #bdc3c7;
border-radius: 12px;
padding: 4px;
align-items: center;
box-sizing: border-box;
width: 100%;
transition: background-color 0.3s;
}
.link-input-container {
flex: 1;
padding: 12px 15px;
text-align: left;
overflow: hidden;
white-space: nowrap;
text-overflow: ellipsis;
display: flex;
align-items: center;
box-sizing: border-box;
}
.clickable-link {
color: var(--accent);
text-decoration: none;
cursor: pointer;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
display: inline-block;
width: auto;
max-width: 100%;;
-webkit-tap-highlight-color: transparent;
}
.clickable-link:hover {
text-decoration: underline;
}
.btn-copy-icon {
background-color: var(--primary);
color: white;
border: none;
border-radius: 10px;
width: 44px;
height: 44px;
cursor: pointer;
transition: background-color 0.2s, transform 0.1s;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.btn-copy-icon:hover {
background-color: #1b4d8a;
}
.btn-copy-icon:active {
transform: scale(0.92);
}
.btn-copy-icon svg {
width: 20px;
height: 20px;
fill: none;
stroke: currentColor;
stroke-width: 2;
stroke-linecap: round;
stroke-linejoin: round;
}
.dark-toggle-btn {
position: absolute;
top: 15px;
left: 15px;
display: flex;
align-items: center;
justify-content: center;
width: 38px;
height: 38px;
border-radius: 50%;
border: none;
background: #eee;
cursor: pointer;
transition: all 0.25s ease;
padding: 0;
z-index: 10;
}
.dark-toggle-btn:hover { background: #e0e0e0; }
.dark-toggle-btn svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

body.dark-mode { --bg-color: #0c0c0c; --text-color: #e8e8e8; --muted-text: #777; }
body.dark-mode .container { background: #151515; box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
body.dark-mode h2 { color: #fff; }
body.dark-mode .dark-toggle-btn { background: #222; }
body.dark-mode .dark-toggle-btn:hover { background: #2e2e2e; }
body.dark-mode .input-copy-wrapper { background: #1c1c1c; border-color: #4a4a4a; }
</style>
</head>
<body>
<div class="container">
<button class="dark-toggle-btn" id="dark-toggle-btn" onclick="toggleDarkMode()" title="الوضع الليلي" type="button">
<svg id="dark-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
</button>

<h2>Faculty of Science Beni Suef University GPA Calculator</h2>

<div class="middle-text">تم نقل العمل إلي عنوان موقع جديد وإضافة مميزات وخصائص أكثر</div>

<div>سيتاح قريبا...</div>

<div class="notification-wrapper">
<span id="copy-toast" class="copy-notification">تم النسخ!</span>
</div>

<div class="input-copy-wrapper">
<div class="link-input-container">
<a href="" target="_blank" id="link-box" class="clickable-link">bsu-science</a>
</div>
<button class="btn-copy-icon" onclick="copyText()" title="نسخ الرابط">
<svg viewBox="0 0 24 24">
<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
</svg>
</button>
</div>

<div style="text-align:center; margin-top: 50px; color: var(--muted-text); font-size: 14px; transition: color 0.3s;">
<div>Developed by Abdelrahman Tarek</div>
<div>Special Physics Department</div>
<div style="font-size: 12px; margin-top: 5px;">لا تنسوا والدي من دعائكم بالرحمة والمغفرة</div>
</div>
</div>

<script>
function updateDarkIcon(isDark) {
const icon = document.getElementById('dark-toggle-icon');
if (!icon) return;
icon.innerHTML = isDark
? '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>'
: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
}

function toggleDarkMode() {
document.body.classList.toggle('dark-mode');
const isDark = document.body.classList.contains('dark-mode');
try { localStorage.setItem('gpaDarkMode', isDark ? '1' : '0'); } catch (e) {}
updateDarkIcon(isDark);
}

(function initDarkMode() {
let saved = '0';
try { saved = localStorage.getItem('gpaDarkMode') || '0'; } catch (e) {}
if (saved === '1') { document.body.classList.add('dark-mode'); }
updateDarkIcon(saved === '1');
})();

function copyText() {
const copyInput = document.getElementById("link-box");
const tempInput = document.createElement("input");
tempInput.value = copyInput.href;
document.body.appendChild(tempInput);
tempInput.select();
tempInput.setSelectionRange(0, 99999);

try {
document.execCommand("copy");
const toast = document.getElementById("copy-toast");
toast.classList.add("show");
setTimeout(() => {
toast.classList.remove("show");
}, 2000);
} catch (err) {
console.error("error: ", err);
}
document.body.removeChild(tempInput);
}
</script>
</body>
</html>
